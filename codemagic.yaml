workflows:

  # ------------------------------------------------------------------
  # Android: quick APK, no signing setup needed (good for testing)
  # ------------------------------------------------------------------
  android-apk:
    name: Android APK (test)
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      flutter: stable
      java: 17
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.pub-cache
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Analyze
        script: flutter analyze --no-fatal-infos
      - name: Run tests
        script: |
          if [ -d test ]; then
            flutter test
          else
            echo "No test folder, skipping."
          fi
      - name: Build APK
        script: |
          flutter build apk --release \
            --build-name=1.0.0 \
            --build-number=$BUILD_NUMBER
    artifacts:
      - build/**/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - kelsengile.dev@gmail.com
        notify:
          success: true
          failure: true

  # ------------------------------------------------------------------
  # Android: signed App Bundle for Google Play
  # Setup: Codemagic > Teams > Code signing identities > Android keystores,
  # upload your keystore and give it the reference name "wallet_keystore".
  # ------------------------------------------------------------------
  android-release:
    name: Android Release (Play Store)
    max_build_duration: 40
    instance_type: linux_x2
    environment:
      flutter: stable
      java: 17
      android_signing:
        - wallet_keystore
      groups:
        - google_play # holds GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
      vars:
        PACKAGE_NAME: "com.example.wallet" # <- change to your applicationId
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.pub-cache
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Set up local.properties
        script: echo "flutter.sdk=$HOME/programs/flutter" > "$CM_BUILD_DIR/android/local.properties"
      - name: Analyze
        script: flutter analyze --no-fatal-infos
      - name: Build App Bundle
        script: |
          flutter build appbundle --release \
            --build-name=1.0.0 \
            --build-number=$(($BUILD_NUMBER + 1))
    artifacts:
      - build/**/outputs/**/*.aab
      - build/**/outputs/**/mapping.txt
    publishing:
      email:
        recipients:
          - kelsengile.dev@gmail.com
        notify:
          success: true
          failure: true
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true

  # ------------------------------------------------------------------
  # iOS: unsigned build, only checks that the app compiles
  # ------------------------------------------------------------------
  ios-check:
    name: iOS Build Check (no signing)
    max_build_duration: 40
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/Library/Caches/CocoaPods
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Install pods
        script: |
          if [ -d ios ]; then
            find . -name "Podfile" -execdir pod install \;
          fi
      - name: Build iOS (no codesign)
        script: flutter build ios --release --no-codesign
    artifacts:
      - build/ios/iphoneos/*.app
    publishing:
      email:
        recipients:
          - kelsengile.dev@gmail.com
        notify:
          success: true
          failure: true

  # ------------------------------------------------------------------
  # iOS: signed IPA for TestFlight / App Store
  # Setup: Codemagic > Teams > Integrations > App Store Connect, create an
  # API key named "codemagic", then set the bundle id below.
  # ------------------------------------------------------------------
  ios-release:
    name: iOS Release (TestFlight)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.example.wallet # <- change to your bundle id
      vars:
        APP_STORE_APPLE_ID: 1234567890 # <- your app's Apple ID (App Store Connect)
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/Library/Caches/CocoaPods
    scripts:
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Get packages
        script: flutter pub get
      - name: Install pods
        script: find . -name "Podfile" -execdir pod install \;
      - name: Analyze
        script: flutter analyze --no-fatal-infos
      - name: Build IPA
        script: |
          flutter build ipa --release \
            --build-name=1.0.0 \
            --build-number=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" | awk '{print $1+1}') \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - kelsengile.dev@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true