workflows:
  wallet_android:
    name: Wallet Android
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      flutter: stable
      java: 17
    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
    scripts:
      - name: Install dependencies
        script: |
          cd wallet
          flutter pub get
      - name: Analyze source
        script: |
          cd wallet
          flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Run tests
        script: |
          cd wallet
          if [ -d test ]; then
            flutter test
          else
            echo "No test directory found; skipping flutter test."
          fi
      - name: Build Android APK
        script: |
          cd wallet
          flutter build apk --release
      - name: Build Android App Bundle
        script: |
          cd wallet
          flutter build appbundle --release
    artifacts:
      - wallet/build/app/outputs/flutter-apk/*.apk
      - wallet/build/app/outputs/bundle/release/*.aab
      - wallet/build/app/outputs/mapping/release/mapping.txt

  wallet_ios_unsigned:
    name: Wallet iOS (unsigned)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/.cocoapods
        - $HOME/Library/Caches/CocoaPods
    scripts:
      - name: Install dependencies
        script: |
          cd wallet
          flutter pub get
      - name: Analyze source
        script: |
          cd wallet
          flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Run tests
        script: |
          cd wallet
          if [ -d test ]; then
            flutter test
          else
            echo "No test directory found; skipping flutter test."
          fi
      - name: Build unsigned iOS app
        script: |
          cd wallet
          flutter build ios --release --no-codesign
    artifacts:
      - wallet/build/ios/iphoneos/*.app