name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you start a build manually from the Actions tab

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # The Flutter project lives in the wallet/ folder, so every "run" step
    # starts there.
    defaults:
      run:
        working-directory: wallet

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show versions
        run: flutter --version

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: |
          if [ -d test ]; then
            flutter test
          else
            echo "No test folder, skipping."
          fi

      - name: Build APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wallet-apk
          # upload-artifact ignores working-directory, so the path includes wallet/
          path: wallet/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30