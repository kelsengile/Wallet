name: wallet
description: "A new Flutter project."
# Prevents the package from being accidentally published to pub.dev.
publish_to: 'none'

# Version number and build number (1.0.0 + build 1).
# Keep in sync with AppConstants.appVersion.
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  shared_preferences: ^2.3.2
  sqflite: ^2.4.1
  path: ^1.9.0
  file_picker: ^13.4.1
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  installed_apps: ^2.2.1
  local_auth: ^3.0.2
  crypto: ^3.0.6
  url_launcher: ^6.3.1
  flutter_local_notifications: ^23.0.4
  timezone: ^0.11.2
  material_ui: any

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Recommended lint rules, activated in analysis_options.yaml.
  flutter_lints: ^6.0.0

# The only Flutter-specific section. Do not add a second "flutter:" key.
flutter:
  uses-material-design: true

  assets:
    - lib/database/schema.sql
    - lib/database/seed.sql
    - assets/images/wallet_logo.png

  # To add custom fonts, add a fonts section here, for example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic