name: momentum
description: "A new Flutter project."
# Prevents the package from being accidentally published to pub.dev.
publish_to: 'none'

# Version number and build number (1.0.0 + build 1).
# Keep in sync with AppConstants.appVersion.
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.2
  sqflite: ^2.4.1
  path: ^1.9.0
  file_picker: ^10.3.0
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  installed_apps: ^1.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Recommended lint rules, activated in analysis_options.yaml.
  flutter_lints: ^6.0.0

# The only Flutter-specific section. Do not add a second "flutter:" key.
flutter:
  uses-material-design: true

  assets:
    - lib/database/schema.sql
    - lib/database/seed.sql

  # To add custom fonts, add a fonts section here, for example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic